[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reautoedit"
version = "0.1.0"
description = "Automatic real estate photo editor (bracketed exposure fusion + style grading)"
requires-python = ">=3.11"
dependencies = [
    "rawpy>=0.21",
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "numpy>=1.26",
    "scipy>=1.11",
    "colour-science>=0.4.4",
    "pydantic>=2.5",
    "typer>=0.12",
    "PyYAML>=6.0",
    "exifread>=3.0",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "scikit-image>=0.22",
]

[project.scripts]
reautoedit = "reautoedit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reautoedit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end pipeline tests requiring fixture images",
]
